<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kit ACR-8D Pro | MdEO Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #0f172a;
            --brand-accent: #2563eb;
            --brand-bg: #e2e8f0;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--brand-bg);
            color: #1e293b;
        }
        .mono { font-family: 'Fira Code', monospace; }
        .serif { font-family: 'Libre Baskerville', serif; }
        
        /* Auto-expand textareas logic - Hard Reset */
        textarea.auto-expand {
            field-sizing: content;
            height: auto !important;
            min-height: 2.5rem;
            overflow: hidden !important;
            resize: none !important;
            display: block;
            width: 100%;
        }

        .industrial-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            height: auto !important; /* Force cards to grow */
        }
        .industrial-card:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        
        .official-document {
            background: #fff;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid #d1d5db;
        }
        
        .official-document::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(#f3f4f6 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.2;
            pointer-events: none;
        }

        .sidebar-item-active {
            background: #f1f5f9;
            border-right: 4px solid var(--brand-accent);
            color: var(--brand-accent);
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-in { animation: slideIn 0.4s ease-out forwards; }

        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-scale-up { animation: scaleUp 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

        textarea::placeholder { font-style: italic; opacity: 0.5; }
    </style>
